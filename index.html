<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envío de Fotos - Policía de Entre Ríos</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #0f172a; text-align: center; color: #f8fafc; }
        .container { max-width: 500px; margin: auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h2 { color: #38bdf8; margin-bottom: 5px; }
        p { color: #94a3b8; font-size: 14px; }
        select, input, button { width: 100%; padding: 15px; margin: 12px 0; box-sizing: border-box; border-radius: 6px; border: 1px solid #475569; font-size: 16px; background: #334155; color: white; }
        select { cursor: pointer; }
        input[type="file"] { background: #475569; cursor: pointer; }
        button { background-color: #0284c7; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #0369a1; }
        button:disabled { background-color: #64748b; cursor: not-allowed; }
        #progreso { margin-top: 15px; font-weight: bold; color: #38bdf8; }
    </style>
</head>
<body>

<div class="container">
    <h2>Policía de Entre Ríos</h2>
    <p>Carga de registros fotográficos por Departamental</p>
    
    <select id="departamental" required>
        <option value="" disabled selected>--- Seleccione Dependencia ---</option>
        <option value="Div. Del. Rurales">Div. Del. Rurales</option>
        <option value="Div. Investigaciones">Div. Investigaciones</option>
        <option value="Div. Prev. Vial">Div. Prev. Vial</option>
        <option value="Div. Toxicologia">Div. Toxicologia</option>
        <option value="Colón">Colón</option>
        <option value="Concordia">Concordia</option>
        <option value="Diamante">Diamante</option>
        <option value="Federación">Federación</option>
        <option value="Federal">Federal</option>
        <option value="Feliciano">Feliciano</option>
        <option value="Gualeguay">Gualeguay</option>
        <option value="Gualeguaychú">Gualeguaychú</option>
        <option value="Islas del Ibicuy">Islas del Ibicuy</option>
        <option value="La Paz">La Paz</option>
        <option value="Nogoyá">Nogoyá</option>
        <option value="Paraná">Paraná</option>
        <option value="San Salvador">San Salvador</option>
        <option value="Tala">Tala</option>
        <option value="Uruguay">Uruguay</option>
        <option value="Victoria">Victoria</option>
        <option value="Villaguay">Villaguay</option>
    </select>

    <input type="text" id="oficial" placeholder="Nombre del Funcionario">
    <input type="file" id="fotos" accept="image/*" multiple required>
    <button id="btnEnviar" onclick="subirImagenes()">Enviar Fotografías</button>
    <div id="progreso"></div>
    </div>
    <p>DGOySP - Div. Planeamiento y Desarrollo</p>
    <p>divisionplaneamientodesarrollo@gmail.com</p>
    <p>App v1.02.11082026_2000 - Compresión JPG borde largo 1920px calidad 70%</p>

<script>
// REEMPLAZA ESTA URL CON LA DE TU WEB APP DE GOOGLE
const URL_GOOGLE = "https://script.google.com/macros/s/AKfycbyTZF0memgEuakS7SbdPZXWlh-lXA0jK1ohwoFwDqWpYeKXDdogDPvf4P_j73rGGrVHkA/exec";

async function subirImagenes() {
    const selectorDept = document.getElementById('departamental').value;
    const datosOficial = document.getElementById('oficial').value.trim() || "Anonimo";
    const inputFotos = document.getElementById('fotos').files;
    const btn = document.getElementById('btnEnviar');
    const divProgreso = document.getElementById('progreso');
    
    if(!selectorDept || inputFotos.length === 0) {
        alert("Por favor, seleccione la Jefatura Departamental y al menos una foto.");
        return;
    }
    
    btn.disabled = true;
    
    for(let i = 0; i < inputFotos.length; i++) {
        const foto = inputFotos[i];
        divProgreso.innerHTML = `Procesando y subiendo foto ${i + 1} de ${inputFotos.length}...`;
        
        try {
            const base64Optimizado = await comprimirYConvertir(foto);
            const oficialLimpio = datosOficial.replace(/[^a-zA-Z0-9]/g, "_");
            const timestamp = generarTimestamp();
            
            const payload = {
                departamental: selectorDept,
                nombre: `${timestamp}_${oficialLimpio}_${foto.name.replace(/\.[^/.]+$/, "")}.jpg`,
                tipo: "image/jpeg",
                archivo: base64Optimizado
            };
            
            const resp = await fetch(URL_GOOGLE, {
                method: "POST",
                body: JSON.stringify(payload)
            });
            const resultado = await resp.json();
            console.log("Respuesta servidor:", resultado);
        } catch (error) {
            console.error("Error enviando: " + foto.name, error);
        }
    }
    
    divProgreso.innerHTML = `¡Éxito! Se guardaron ${inputFotos.length} fotos en la carpeta de Jefatura ${selectorDept}.`;
    btn.disabled = false;
    document.getElementById('fotos').value = "";
    document.getElementById('oficial').value = "";
}

// Función que redimensiona y convierte a JPG con borde largo 1920px calidad 70%
function comprimirYConvertir(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = event => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const LONG_EDGE = 1920; // borde largo fijo
                let width = img.width;
                let height = img.height;

                if (width >= height) {
                    const ratio = LONG_EDGE / width;
                    width = LONG_EDGE;
                    height = Math.round(height * ratio);
                } else {
                    const ratio = LONG_EDGE / height;
                    height = LONG_EDGE;
                    width = Math.round(width * ratio);
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                const dataUrl = canvas.toDataURL('image/jpeg', 0.7); // calidad 70%
                resolve(dataUrl);
            };
        };
        reader.onerror = error => reject(error);
    });
}

// Función para generar timestamp tipo YYYY-MM-DD (YYYY-Mes-DD)
function generarTimestamp() {
    const meses = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
    const hoy = new Date();
    const yyyy = hoy.getFullYear();
    const dd = String(hoy.getDate()).padStart(2, '0');
    const mesTexto = meses[hoy.getMonth()];
    
    const hh = String(hoy.getHours()).padStart(2, '0');
    const mm = String(hoy.getMinutes()).padStart(2, '0');
    
    return `${yyyy}-${mesTexto}-${dd}_${hh}${mm}`;
}
</script>
</body>
</html>
